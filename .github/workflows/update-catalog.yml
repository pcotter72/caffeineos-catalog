name: Update catalog

on:
  schedule:
    - cron: '17 4 * * *'      # daily 04:17 UTC
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]
    paths:
      - sources.txt
      - tools/**
      - .github/workflows/update-catalog.yml

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lhasa (for .lha archives)
        run: sudo apt-get update -q && sudo apt-get install -y -q lhasa

      - name: Build catalog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I tools/build_catalog.py sources.txt catalog.txt

      - name: Commit catalog.txt if it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.txt
          if [ -d readmes ]; then git add readmes; fi
          if git diff --cached --quiet; then
            echo "catalog unchanged"
          else
            git commit -m "Update catalog.txt"
            git push
          fi
